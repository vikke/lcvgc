name: CI

# CI と Release の一体化 workflow。
#
# - lint:      rustfmt + clippy
# - build-and-test: 3 OS で release build + test を行い、archive を artifact に上げる
# - release:   build-and-test 完了後に push (= main 含む全 branch) なら走り、
#              CI artifact を集めて固定タグ `latest` の GitHub Release を上書きする
#
# 1 人開発 + 「最新だけあれば良い」前提のため、release は version 別ではなく
# `latest` 1 個固定で運用する。各 push のたびに asset が上書きされる。
# version 別履歴が欲しくなったら `softprops/action-gh-release` を別タグでも
# 呼び出す形に拡張する。
#
# Single workflow combining CI and Release. After tests pass, the release
# job overwrites the fixed `latest` tag's GitHub Release with the freshly
# built archives. Suited for a one-person dev loop where only the most
# recent build matters.

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: write  # release job が tag / release を作成・更新するのに必要

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build-and-test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin_ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin_ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install ALSA dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build (workspace, release)
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Test (workspace)
        run: cargo test --workspace --target ${{ matrix.target }}

      # archive 名 / pkg-dir 名は version を含めず target だけで固定する。
      # 1 人開発 + latest 上書き運用のため、version-agnostic に統一しないと
      # cargo binstall の bin-dir が version 違いで外れる。
      #
      # `pkg-dir` and archive use `lcvgc-<target>` (no version) so the
      # cargo-binstall `bin-dir` template stays valid across upgrades.
      - name: Package release archive
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          archive_fmt="${{ matrix.archive }}"
          bin_ext="${{ matrix.bin_ext }}"
          pkg_dir="lcvgc-${target}"
          mkdir "$pkg_dir"
          cp "target/${target}/release/lcvgc${bin_ext}" "$pkg_dir/"
          cp README.md "$pkg_dir/" 2>/dev/null || true
          cp LICENSE "$pkg_dir/" 2>/dev/null || true

          if [ "$archive_fmt" = "zip" ]; then
            archive_name="${pkg_dir}.zip"
            7z a "$archive_name" "$pkg_dir"
          else
            archive_name="${pkg_dir}.tar.gz"
            tar -czf "$archive_name" "$pkg_dir"
          fi
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: lcvgc-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.archive_name }}
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------
  # 全 build-and-test (3 OS) が pass した上で push (PR ではない) の時だけ走る。
  # 固定タグ `latest` の GitHub Release を毎回上書きアップロードする。
  #
  # Runs only on push events after all build-and-test jobs pass. Overwrites
  # the fixed `latest` Release with the freshly built archives.
  # ------------------------------------------------------------------------
  release:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 同 workflow run 内の build-and-test がアップロードした 3 archive を
      # 一括 download。run id はデフォルトで current run。
      # Downloads the archive artifacts uploaded by build-and-test in this
      # same workflow run.
      - name: Download archives from current run
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Move archives to release_assets/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_assets
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release_assets/ \;
          ls -la release_assets/

      # 同名タグの release があれば asset を入れ替える。softprops/action-gh-release
      # は同名 asset があれば置換する挙動なので、過去の asset が残らない。
      # tag は `latest` 固定。release name にも commit SHA を含めて識別性を確保する。
      #
      # Overwrites the `latest` tag's release. The action replaces same-named
      # assets, so old binaries are not retained.
      - name: Upload to `latest` Release (overwrite)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest (build ${{ github.sha }})
          body: |
            最新 main / branch の自動 release ビルド。

            - commit: ${{ github.sha }}
            - branch: ${{ github.ref_name }}
            - workflow run: ${{ github.run_id }}
          files: release_assets/*
          fail_on_unmatched_files: true
          # 同名 release を上書き
          # Overwrite the same-tagged release in place.
          make_latest: true
