name: CI

# CI と Release の一体化 workflow。
#
# - lint:      rustfmt + clippy
# - build-and-test: 3 OS で release build + test を行い、archive を artifact に上げる
# - release:   build-and-test 完了後に push なら走る。
#              (a) 固定タグ `latest` の Release を **作り直す**
#                  (delete → create) ことで created_at をビルド時刻に
#                  追従させる。`released this N days ago` が古いまま
#                  だった問題への対処。cargo-binstall は asset URL
#                  (= tag 名 + ファイル名) を見るため、Release ID
#                  変動の影響を受けない。
#              (b) ビルドごとに `nightly-<short_sha>` Release を
#                  別途発行。同 artifact を再利用するためコンパイル
#                  時間は増えない (アップロード時間のみ追加)。
#              (c) `nightly-*` Release は直近 `${NIGHTLY_KEEP}` 件
#                  残して、それ以外は tag ごと削除して掃除する。
#
# Single workflow combining CI and Release. After tests pass, the release
# job recreates the `latest` release on every push (so its "released at"
# timestamp tracks the build time) and additionally publishes a
# `nightly-<short_sha>` release per build, pruning all but the most
# recent `${NIGHTLY_KEEP}` nightly releases.

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: write  # release job が tag / release を作成・更新するのに必要

env:
  CARGO_TERM_COLOR: always
  # `nightly-*` Release を直近何件残すか。env で外出ししているので、
  # 増やしたいときはこの値を書き換えるだけで prune ステップに反映される。
  # Number of most recent `nightly-*` releases to keep when pruning.
  NIGHTLY_KEEP: "3"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build-and-test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin_ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin_ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install ALSA dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build (workspace, release)
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Test (workspace)
        run: cargo test --workspace --target ${{ matrix.target }}

      # archive 名 / pkg-dir 名は version を含めず target だけで固定する。
      # 1 人開発 + latest 上書き運用のため、version-agnostic に統一しないと
      # cargo binstall の bin-dir が version 違いで外れる。
      #
      # `pkg-dir` and archive use `lcvgc-<target>` (no version) so the
      # cargo-binstall `bin-dir` template stays valid across upgrades.
      - name: Package release archive
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          archive_fmt="${{ matrix.archive }}"
          bin_ext="${{ matrix.bin_ext }}"
          pkg_dir="lcvgc-${target}"
          mkdir "$pkg_dir"
          cp "target/${target}/release/lcvgc${bin_ext}" "$pkg_dir/"
          cp README.md "$pkg_dir/" 2>/dev/null || true
          cp LICENSE "$pkg_dir/" 2>/dev/null || true

          if [ "$archive_fmt" = "zip" ]; then
            archive_name="${pkg_dir}.zip"
            7z a "$archive_name" "$pkg_dir"
          else
            archive_name="${pkg_dir}.tar.gz"
            tar -czf "$archive_name" "$pkg_dir"
          fi
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: lcvgc-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.archive_name }}
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------------
  # 全 build-and-test (3 OS) が pass した上で push (PR ではない) の時だけ走る。
  # 固定タグ `latest` の Release を毎回再作成 + `nightly-<sha>` Release を
  # 追加発行 + 古い `nightly-*` を直近 NIGHTLY_KEEP 件残して prune する。
  #
  # Runs only on push events after all build-and-test jobs pass. Recreates
  # the `latest` release, publishes a per-build `nightly-<short_sha>`
  # release, and prunes older nightly releases beyond NIGHTLY_KEEP.
  # ------------------------------------------------------------------------
  release:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 同 workflow run 内の build-and-test がアップロードした 3 archive を
      # 一括 download。run id はデフォルトで current run。
      # Downloads the archive artifacts uploaded by build-and-test in this
      # same workflow run.
      - name: Download archives from current run
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Move archives to release_assets/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_assets
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release_assets/ \;
          ls -la release_assets/

      # `latest` Release を毎回 **delete → create** で作り直す。
      # action-gh-release の上書きは created_at を更新しないため、
      # UI 上の "released this N days ago" がビルド時刻と乖離する問題が
      # あった。gh CLI で消してから作り直すことで created_at もタグ
      # オブジェクトの日付も毎回 fresh になる。
      # cargo-binstall は asset URL (タグ名 + ファイル名) を参照するため、
      # Release ID 変動の影響は受けない。
      #
      # Recreate the `latest` release every push so its created_at tracks
      # the build time. Asset URLs (consumed by cargo-binstall) stay stable.
      - name: Recreate `latest` Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag || true
          notes=$(printf '最新 main / branch の自動 release ビルド。\n\n- commit: %s\n- branch: %s\n- workflow run: %s\n' \
            "${{ github.sha }}" "${{ github.ref_name }}" "${{ github.run_id }}")
          gh release create latest release_assets/* \
            --title "latest (build ${{ github.sha }})" \
            --notes "$notes" \
            --latest

      # ビルドごとの履歴 release `nightly-<short_sha>` を発行する。
      # 同 artifact をそのまま転用するためコンパイルは追加で走らない。
      # 同 sha のリビルド時は既存 release を差し替える。
      #
      # Publish a per-build `nightly-<short_sha>` release reusing the same
      # artifacts (no extra compilation). Replaces an existing release for
      # the same SHA if rebuilt.
      - name: Publish `nightly-<sha>` Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          short_sha="$(printf '%s' '${{ github.sha }}' | cut -c1-7)"
          tag="nightly-${short_sha}"
          date_utc="$(date -u +%Y-%m-%d)"
          notes=$(printf 'ビルドごとの履歴 release。\n\n- commit: %s\n- branch: %s\n- workflow run: %s\n' \
            "${{ github.sha }}" "${{ github.ref_name }}" "${{ github.run_id }}")
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" release_assets/* \
            --title "nightly ${short_sha} (${date_utc})" \
            --notes "$notes"

      # 直近 NIGHTLY_KEEP 件の `nightly-*` だけ残し、それ以外は release と
      # tag を削除する。`gh release list` は publish 順 (新しい順) を返すが、
      # 念のため createdAt で並べ直してから先頭 NIGHTLY_KEEP 件をスキップする。
      #
      # Keep only the most recent NIGHTLY_KEEP `nightly-*` releases.
      - name: Prune old `nightly-*` releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_KEEP: ${{ env.NIGHTLY_KEEP }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,createdAt \
            --jq "map(select(.tagName | startswith(\"nightly-\"))) | sort_by(.createdAt) | reverse | .[${NIGHTLY_KEEP}:] | .[].tagName" \
            | while read -r old_tag; do
                [ -z "$old_tag" ] && continue
                echo "Pruning $old_tag"
                gh release delete "$old_tag" --yes --cleanup-tag
              done
