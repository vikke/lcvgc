name: Release

# main の Cargo.toml version が変わったら、CI run が同 commit で作った
# archive artifact を流用して GitHub Release を作る。
# 重複 build を避けるため build job 自体は持たない (PR #63)。
#
# Reuses the archive artifacts produced by ci.yml at the same commit SHA
# (PR #63), eliminating the duplicate release build.

on:
  push:
    branches: [main]
  # Actions UI から手動で起動できるようにする。version 比較はスキップし、
  # 現在の Cargo.toml の version をそのまま使って release を作る。
  # 初回 release や、何らかの理由で auto-release が走らなかった時のリカバリ用。
  #
  # Manual trigger from the Actions UI. Used for the very first release
  # or as a recovery path if the auto-release didn't fire.
  workflow_dispatch:

permissions:
  contents: write  # Release / tag を作成するために必要
  actions: read    # dawidd6/action-download-artifact が CI run を query するのに必要

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------------
  # 1. version 変化を検出する。lcvgc / lcvgc-core 両方の Cargo.toml を読み、
  #    HEAD と HEAD~1 で diff を取る。両者の version が不一致なら fail。
  #    変化なしなら以降の job を skip する。
  # ------------------------------------------------------------------------
  check_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      should_release: ${{ steps.detect.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # HEAD~1 と diff を取るため

      - id: detect
        name: Detect version change
        shell: bash
        run: |
          set -euo pipefail

          # 各 Cargo.toml の最初の version 行を取り出す小ヘルパ。
          # `[package]` 直下の version を想定し、最初の `^version = "..."` を採用。
          read_version() {
            local path="$1"
            grep -E '^version = "' "$path" | head -1 | sed -E 's/.*"(.*)"/\1/'
          }
          read_version_at() {
            local rev="$1"
            local path="$2"
            git show "$rev:$path" 2>/dev/null | grep -E '^version = "' | head -1 | sed -E 's/.*"(.*)"/\1/'
          }

          cur_lcvgc=$(read_version crates/lcvgc/Cargo.toml)
          cur_core=$(read_version crates/lcvgc-core/Cargo.toml)

          # 整合性 assert: lcvgc と lcvgc-core の version は揃っている前提。
          if [ "$cur_lcvgc" != "$cur_core" ]; then
            echo "::error::lcvgc ($cur_lcvgc) と lcvgc-core ($cur_core) の version が一致しません"
            exit 1
          fi

          # workflow_dispatch (手動起動) の場合は version 比較をスキップして
          # 必ず release する。push 時のみ HEAD と HEAD~1 を比較する。
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "workflow_dispatch: 手動起動のため version 比較をスキップして release します ($cur_lcvgc)"
            echo "version=$cur_lcvgc" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 直前 commit の version を取り出して diff。HEAD が初回 commit の場合
          # (= HEAD~1 が無い) は強制的に release を走らせる。
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            prev_lcvgc=$(read_version_at HEAD~1 crates/lcvgc/Cargo.toml || echo "")
            prev_core=$(read_version_at HEAD~1 crates/lcvgc-core/Cargo.toml || echo "")
          else
            prev_lcvgc=""
            prev_core=""
          fi

          if [ "$cur_lcvgc" != "$prev_lcvgc" ] || [ "$cur_core" != "$prev_core" ]; then
            echo "version 変化を検出: lcvgc $prev_lcvgc -> $cur_lcvgc, lcvgc-core $prev_core -> $cur_core"
            echo "version=$cur_lcvgc" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version 変化なし: $cur_lcvgc"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------------
  # 2. CI run の artifact を流用して release を作る。
  #    dawidd6/action-download-artifact で同 commit SHA の CI run を見つけ、
  #    各 arch の archive を download し、softprops/action-gh-release で
  #    v<version> タグの GitHub Release に attach する。
  # ------------------------------------------------------------------------
  release:
    needs: check_version
    if: needs.check_version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 同 commit SHA の CI run から各 arch の archive artifact を一括 download。
      # CI が完走していないとここで失敗するので、CI 通過済みの commit でのみ
      # release が成立する保証になる。
      #
      # Downloads all archive artifacts produced by the CI run on the same
      # commit. Fails if CI has not finished, ensuring releases come from
      # commits that passed CI.
      - name: Download CI artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          commit: ${{ github.sha }}
          path: artifacts
          # 命名: ci.yml の matrix が "lcvgc-<target>" で upload している
          # ので、それに整合する prefix で取る。
          # Matches the artifact names ci.yml uses (`lcvgc-<target>`).
          name: lcvgc-
          name_is_regexp: true
          if_no_artifact_found: fail
          # CI run が同 SHA で複数あった場合 (re-run 含む) は最新成功 run。
          # Pick the latest successful CI run for the SHA.
          workflow_conclusion: success

      - name: Flatten artifacts (one zip / tgz per dir)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_assets
          # download-artifact は各 artifact をサブディレクトリに展開するため、
          # 中の archive を release_assets/ 直下に集める。
          # Flatten subdirectory layout produced by download-artifact.
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check_version.outputs.version }}
          name: v${{ needs.check_version.outputs.version }}
          generate_release_notes: true
          files: release_assets/*
          fail_on_unmatched_files: true
