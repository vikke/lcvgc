[package]
name = "lcvgc"
version = "0.9.5"
edition = "2021"

[lib]
name = "lcvgc"
path = "src/lib.rs"

[[bin]]
name = "lcvgc"
path = "src/main.rs"

[dependencies]
lcvgc-core = { path = "../lcvgc-core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Media",
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Wdk_System_SystemInformation",
  "Wdk_System_SystemServices",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

# cargo-binstall のための metadata。
# 1 人開発フェーズでは ci.yml が固定タグ `latest` の GitHub Release を毎 push
# で上書きする運用。バージョン非依存の URL / archive 名にしてあるので、
# ユーザー側は `cargo binstall --git ... lcvgc --force` で常に最新が落ちる。
#
# Metadata for cargo-binstall. The CI workflow overwrites the `latest`
# tag's GitHub Release on every push, so URLs / archive layout are kept
# version-agnostic.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/latest/{ name }-{ target }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
