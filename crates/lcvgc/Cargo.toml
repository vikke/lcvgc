[package]
name = "lcvgc"
version = "0.16.0"
edition = "2021"
# cargo-binstall の `pkg-url` テンプレートで `{ repo }` を展開するため必須。
# 未指定だと "missing key `repo`" で binstall が source build に fallback する。
# Required so `cargo-binstall` can resolve `{ repo }` in pkg-url. Without
# this field binstall fails to render the URL and falls back to source build.
repository = "https://github.com/vikke/lcvgc"

[lib]
name = "lcvgc"
path = "src/lib.rs"

[[bin]]
name = "lcvgc"
path = "src/main.rs"

[[bin]]
name = "lcvgc-gen"
path = "src/bin/lcvgc-gen.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "5"
midir = "0.10"
midly = "0.5"
nom = "7"
notify = "7"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Media",
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Wdk_System_SystemInformation",
  "Wdk_System_SystemServices",
] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
pretty_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[[bench]]
name = "parser_bench"
harness = false

# cargo-binstall のための metadata。
# 1 人開発フェーズでは ci.yml が固定タグ `latest` の GitHub Release を毎 push
# で上書きする運用。バージョン非依存の URL / archive 名にしてあるので、
# ユーザー側は `cargo binstall --git ... lcvgc --force` で常に最新が落ちる。
#
# Metadata for cargo-binstall. The CI workflow overwrites the `latest`
# tag's GitHub Release on every push, so URLs / archive layout are kept
# version-agnostic.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/latest/{ name }-{ target }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
