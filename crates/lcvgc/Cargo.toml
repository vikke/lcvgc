[package]
name = "lcvgc"
version = "0.9.4"
edition = "2021"

[lib]
name = "lcvgc"
path = "src/lib.rs"

[[bin]]
name = "lcvgc"
path = "src/main.rs"

[dependencies]
lcvgc-core = { path = "../lcvgc-core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Media",
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Wdk_System_SystemInformation",
  "Wdk_System_SystemServices",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

# cargo-binstall のための metadata。GitHub Release に置いた archive を
# download install するための URL pattern を指定する。
# release.yml が `lcvgc-<version>-<target>.<archive>` 形式で archive を
# アップロードするため、それに整合する pkg-url を書く。
#
# Metadata for cargo-binstall: tells the tool how to find the prebuilt
# archive on GitHub Releases. Must stay in sync with the archive naming
# used by .github/workflows/release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
